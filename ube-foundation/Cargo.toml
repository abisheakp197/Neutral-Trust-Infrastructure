[package]
name = "ube-foundation"
version = "0.1.0"
edition = "2024"
description = "Universal Behavioral Engine Foundation: A Post-Quantum Cryptographic Trust Engine for Autonomous AI Agents."
license-file = "LICENSE.md"
repository = "https://github.com/aiprotocol/Neutral-Trust-Infrastructure"
homepage = "https://github.com/aiprotocol/Neutral-Trust-Infrastructure"
readme = "README.md"
keywords = ["pqc", "trust-engine", "post-quantum", "ai-agents", "cryptography"]
categories = ["cryptography", "science"]

[lib]
name = "ube_foundation"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module", "abi3-py310"], optional = true }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2.1"
rand = "0.8"
chacha20poly1305 = "0.10"
x25519-dalek = "2.0"
chrono = { version = "0.4", features = ["serde", "arbitrary"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
warp = { version = "0.3", default-features = false, features = ["tls"] }
arbitrary = { version = "1.3", features = ["derive"] }
pqcrypto-dilithium = "0.5.0"
pqcrypto-kyber = "0.8.1"
pqcrypto-traits = "0.3.5"

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
proptest = "1.4"
