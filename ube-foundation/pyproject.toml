[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ube-foundation"
version = "0.1.4"
description = "Neutral Trust Infrastructure (NTI) - Zero-trust post-quantum security runtime & governance for AI agents"
authors = [{ name = "NTI Team" }]
readme = "README.md"
keywords = ["pqc", "post-quantum", "ai-agents", "zero-trust", "cryptography", "security", "governance"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://abisheakp197.github.io/ube/"
Documentation = "https://github.com/abisheakp197/ube#readme"
Repository = "https://github.com/abisheakp197/ube"

[tool.maturin]
features = ["python"]
manifest-path = "Cargo.toml"
module-name = "ube_foundation.ube_foundation"
