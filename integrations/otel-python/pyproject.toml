[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nti-otel"
version = "0.1.0"
description = "Tamper-evident records for AI agent tool calls, from an existing OpenTelemetry pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["opentelemetry", "ai-agents", "audit", "tamper-evident", "nti"]
dependencies = ["opentelemetry-api>=1.20"]

[project.optional-dependencies]
signing = ["ube-foundation==0.2.1"]
test = ["opentelemetry-sdk>=1.20", "pytest>=8"]

[project.scripts]
nti-otel = "nti_otel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
