[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nti-otel"
version = "0.1.0"
description = "Tamper-evident records for AI agent tool calls, from an existing OpenTelemetry pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["opentelemetry", "ai-agents", "audit", "tamper-evident", "nti"]
# SpanProcessor is an SDK class, so the SDK is a hard requirement: importing
# the package with only opentelemetry-api installed fails on
# `from opentelemetry.sdk.trace import SpanProcessor`.
dependencies = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/abisheakp197/Neutral-Trust-Infrastructure/tree/main/integrations/otel-python"
Source = "https://github.com/abisheakp197/Neutral-Trust-Infrastructure"
Issues = "https://github.com/abisheakp197/Neutral-Trust-Infrastructure/issues"
Specification = "https://github.com/abisheakp197/nti-spec"

[project.optional-dependencies]
signing = ["ube-foundation==0.2.1"]
test = ["pytest>=8"]

[project.scripts]
nti-otel = "nti_otel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
