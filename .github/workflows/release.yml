name: Build Wheels & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: wheels-x86_64-linux-gnu
            maturin-args: "--release --out dist --manylinux 2_28"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: wheels-aarch64-linux-gnu
            maturin-args: "--release --out dist --manylinux 2_28"
          - target: universal2-apple-darwin
            os: macos-14
            artifact-name: wheels-universal2-apple-darwin
            maturin-args: "--release --out dist"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact-name: wheels-x86_64-pc-windows-msvc
            maturin-args: "--release --out dist"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install aarch64 cross-toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.maturin-args }}
          working-directory: ube-foundation
          container: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'off' || 'auto' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ube-foundation/dist

  publish:
    name: Publish wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
