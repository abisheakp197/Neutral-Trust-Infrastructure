name: Build Wheels & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: wheels-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: wheels-aarch64-linux-gnu
          - target: universal2-apple-darwin
            os: macos-14
            artifact-name: wheels-universal2-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact-name: wheels-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: ube-foundation
          manylinux: "2_28"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ube-foundation/dist

  publish:
    name: Publish wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
