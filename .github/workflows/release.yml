name: Build Wheels & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to (re)sign — manual runs only"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-wheels:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: wheels-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact-name: wheels-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact-name: wheels-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact-name: wheels-aarch64-linux-musl
          - target: universal2-apple-darwin
            os: macos-14
            artifact-name: wheels-universal2-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact-name: wheels-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: ube-foundation
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ube-foundation/dist

  publish:
    name: Publish wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # Sign release artifacts with Sigstore (keyless) and attach SLSA build
  # provenance, so consumers can verify origin and integrity. This is the
  # artifact-signing process documented in RELEASE.md and required by the
  # LFDT Release Signing policy (SLSA Level 1 minimum for incubation).
  release-signing:
    name: Sign release artifacts (Sigstore)
    needs: build-wheels
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Download built wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA256SUMS.sigstore.json' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Sign artifacts (keyless, Sigstore)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS.txt

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Upload signed artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" dist/SHA256SUMS.txt dist/SHA256SUMS.sigstore.json --clobber
