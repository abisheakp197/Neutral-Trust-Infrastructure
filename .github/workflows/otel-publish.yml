name: Publish nti-otel

# Trusted publishing (OIDC): no API token is stored in this repository. Before
# the first tag, add a pending publisher on PyPI for project `nti-otel`,
# owner `abisheakp197`, repo `Neutral-Trust-Infrastructure`, workflow
# `otel-publish.yml`, environment `pypi`. Then push a tag `nti-otel-v0.1.0`.

on:
  push:
    tags: ['nti-otel-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/otel-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl && python -c "import nti_otel, sys; print('installed', nti_otel.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: integrations/otel-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
