name: Jules AI Automation Workflow

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  jules-agent:
    name: Run Jules AI Agent
    if: contains(github.event.comment.body, '/jules') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "maturin==1.9.6" "twine==6.1.0"
          npm install -g "@google/jules@0.1.42"

      - name: Execute Jules Task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "Executing Jules task based on comment..."
          printf '%s' "$COMMENT_BODY" > /tmp/comment_body.txt
          jules --prompt-file /tmp/comment_body.txt
