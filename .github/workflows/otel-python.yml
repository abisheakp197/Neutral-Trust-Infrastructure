name: nti-otel

on:
  push:
    branches: [main]
    paths: ['integrations/otel-python/**']
  pull_request:
    paths: ['integrations/otel-python/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: integrations/otel-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,signing]"
      - name: Test
        run: python -m pytest -q
      - name: Verify the tamper detection end to end
        run: |
          python - <<'PY'
          from opentelemetry.sdk.trace import TracerProvider
          from nti_otel import install, read_entries, verify
          provider = TracerProvider()
          install(provider, path="decisions.jsonl")
          tracer = provider.get_tracer("ci")
          with tracer.start_as_current_span("tool.invoke") as s:
              s.set_attribute("nti.capability", "payments:charge")
              s.set_attribute("nti.decision", "Allow")
          entries = list(read_entries("decisions.jsonl"))
          assert verify(entries) == [], verify(entries)
          entries[0]["attributes"]["nti.decision"] = "Deny"
          assert verify(entries), "editing a decision must be detected"
          print("tamper detection verified")
          PY
