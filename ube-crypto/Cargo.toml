[package]
name = "ube-crypto"
version = "0.1.0"
edition = "2021"
authors = ["UBE Foundation"]
description = "Post-quantum cryptographic primitives for the UBE security foundation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abisheakp197/UBE/tree/master/ube-crypto"
readme = "README.md"
keywords = ["cryptography", "post-quantum", "lattice", "blake3", "security"]
categories = ["cryptography", "security"]

[dependencies]
# Hashing
blake3 = { version = "1.5", features = ["serde"] }
sha2 = "0.10"
sha3 = "0.10"

# Post-quantum cryptography (optional - uses placeholder implementations by default)
pqcrypto = { version = "0.16", features = ["kyber", "dilithium", "sphincs"], optional = true }

# Symmetric encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# KDF
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }

# Constant-time operations
subtle = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Randomness
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"

# Error handling
thiserror = "1.0"

[features]
default = ["std"]
std = []
no_std = []
pqc = ["dep:pqcrypto"]

[dev-dependencies]
criterion = "0.4"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "crypto"
harness = false

[features]
default = ["std"]
std = []
no_std = []
