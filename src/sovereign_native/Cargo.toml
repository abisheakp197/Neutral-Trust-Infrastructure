[package]
name = "sovereign_native"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
pqcrypto-dilithium = "0.5"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"
bytes = "1.0"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
env_logger = "0.10"
regex = "1.10"
walkdir = "2.5"
hex = "0.4"
futures = "0.3"
rand = "0.8"
lazy_static = "1.4"
async-trait = "0.1"
tempfile = "3.0"
